<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Preview | Frontend Mentor</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/index.js" defer></script>
  </head>
  <body>
    <main>
      <div class="wrapper">
        <article class="article">
          <img
            class="article__image"
            src="img/drawers.jpg"
            alt="Image of dresser"
          />
          <div class="article__wrapper">
            <div>
              <h2 class="article__title">
                Shift the overall look and feel by adding these wonderful
                touches to furniture in your home
              </h2>

              <p class="article__content">
                Ever been in a room and felt like something was missing? Perhaps
                it felt slightly bare and uninviting. I’ve got some simple tips
                to help you make any room feel complete.
              </p>

              <div class="social__wrapper">
                <div class="author__wrapper">
                  <img
                    class="article__avatar"
                    src="img/avatar-michelle.jpg"
                    alt=""
                  />
                  <div class="article__contact">
                    <p class="article__author">Michelle Appleton</p>
                    <p class="article__date">28 Jun 2020</p>
                  </div>
                </div>
                <img class="article__share" src="img/icon-share.svg" alt="" />
              </div>
            </div>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
